name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  go:
    name: Go (lint, unit, acceptance)
    runs-on: ubuntu-latest
    # The database the Postgres tests run against, as `task db:up` starts it
    # locally (docker-compose.yml). Every Go step gets the URL, so no
    # Postgres test skips in CI.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      STARTER_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
      - name: Unit tests
        run: go test -race ./cmd/... ./internal/... ./scripts/internal/... ./scripts/rename/ ./test/terminal/term/...
      # template:start
      - name: Init tool unit tests
        run: go test -race ./scripts/initproject/
      # template:end
      - name: Acceptance tests (Godog)
        run: go test ./test/acceptance/ -count=1 --godog.format=pretty
      - name: Terminal journeys (Godog)
        run: go test ./test/terminal/ -count=1 --godog.format=pretty

  # The packages whose code differs on Windows, tested there. Nothing else
  # in CI can run Windows code.
  go-windows:
    name: Go on Windows (jsonfile unit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test ./internal/adapters/storage/jsonfile/

  web:
    name: Web (lint, typecheck, unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: go tool -modfile=tools/go.mod oapi-codegen -config api/oapi-codegen.server.yaml api/openapi.yaml
      - run: go tool -modfile=tools/go.mod oapi-codegen -config api/oapi-codegen.client.yaml api/openapi.yaml
      - run: pnpm --dir web gen:api
      - name: Fail if anything changed
        run: git diff --exit-code

  e2e:
    name: E2E (playwright-bdd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      # Every browser the e2e projects use (web/playwright.config.ts), as
      # `task setup` installs them.
      - run: pnpm --dir web exec playwright install --with-deps chromium webkit firefox
      - run: pnpm --dir web build
      - run: pnpm --dir web e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 14

  image:
    name: Docker image
    needs: [go, go-windows, web, codegen, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

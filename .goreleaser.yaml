# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: starter

builds:
  - id: starter
    main: ./cmd/starter
    binary: starter
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/RockLikeAmadeus/go-application-starter/internal/adapters/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

# Fly.io config for production. One-time setup is described in README.md.
app = "go-application-starter"
primary_region = "iad"

[build]
  # CI deploys a prebuilt image from GHCR (--image); this is only used for
  # manual `fly deploy` from a laptop.
  dockerfile = "Dockerfile"

[env]
  STARTER_STORAGE = "jsonfile"
  STARTER_DATA_DIR = "/data"
  STARTER_LOG_FORMAT = "json"

# The jsonfile adapter needs a persistent volume and a SINGLE machine
# (only one process may hold the data directory lock).
[mounts]
  source = "app_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

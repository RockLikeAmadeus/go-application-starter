# https://taskfile.dev — run `task` to list tasks.
version: "3"

vars:
  BIN: bin
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X github.com/RockLikeAmadeus/go-application-starter/internal/adapters/cli.Version={{.VERSION}}
  # The Android SDK: $ANDROID_HOME, or Android Studio's default on Linux.
  ANDROID_HOME:
    sh: echo "${ANDROID_HOME:-$HOME/Android/Sdk}"
  ADB: "{{.ANDROID_HOME}}/platform-tools/adb"
  # Must match applicationId in mobile/android/app/build.gradle.
  ANDROID_APP_ID: com.example.starter
  # The Wails CLI, pinned in tools/go.mod with the Wails module.
  WAILS: go tool -modfile=tools/go.mod wails3
  # Packages need a version that starts with a digit: a release tag (v2.0.0)
  # loses its v, and anything else (a commit, 060a096-dirty) is 0.0.0.
  PACKAGE_VERSION: '{{if regexMatch "^v?[0-9]+[.][0-9]+[.][0-9]+$" .VERSION}}{{trimPrefix "v" .VERSION}}{{else}}0.0.0{{end}}'
  # The desktop app's packages are built for this machine's architecture only.
  ARCH: amd64

env:
  ANDROID_HOME: "{{.ANDROID_HOME}}"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # ---------------------------------------------------------------- setup
  setup:
    desc: Install all dependencies and git hooks (run once after cloning)
    cmds:
      - go mod download
      - pnpm --dir web install
      - pnpm --dir web exec playwright install --with-deps chromium webkit firefox
      - cmd: lefthook install
        ignore_error: true

  # template:start
  init:
    desc: 'Make this template your own project, e.g. task init -- --module github.com/you/app --name "Acme" [--remove-sample] (see docs/template.md)'
    cmds:
      - go run ./scripts/initproject {{.CLI_ARGS}}

  # template:end
  rename:
    desc: 'Give the project a new name, e.g. task rename -- --name "Zenith Notes" [--module example.com/you/zenith] [--dry-run] (see docs/rename.md)'
    cmds:
      - go run ./scripts/rename {{.CLI_ARGS}}

  # ---------------------------------------------------------------- codegen
  gen:
    desc: Regenerate Go server/client and TypeScript types from api/openapi.yaml
    cmds:
      - go tool -modfile=tools/go.mod oapi-codegen -config api/oapi-codegen.server.yaml api/openapi.yaml
      - go tool -modfile=tools/go.mod oapi-codegen -config api/oapi-codegen.client.yaml api/openapi.yaml
      - pnpm --dir web gen:api

  gen:check:
    desc: Fail if generated code is out of date with the OpenAPI spec
    cmds:
      - task: gen
      - git diff --exit-code -- internal/adapters/httpapi/openapi internal/adapters/httpclient/apiclient web/src/api/schema.gen.ts

  # ---------------------------------------------------------------- dev
  dev:
    desc: Run the API (:8080) and Vite dev server (:5173) together, reloading on changes
    deps: [dev:server, web:dev]

  dev:server:
    desc: Run the API server, rebuilding and restarting it when Go code changes
    cmds:
      - go tool -modfile=tools/go.mod air

  run:server:
    desc: Run the API server (API-only; the UI comes from Vite in dev)
    cmds:
      - go run ./cmd/server

  run:cli:
    desc: "Run the CLI, e.g. task run:cli -- --help"
    cmds:
      - go run ./cmd/starter {{.CLI_ARGS}}

  run:tui:
    desc: Run the terminal UI
    interactive: true
    cmds:
      - go run ./cmd/starter tui {{.CLI_ARGS}}

  run:desktop:
    desc: Run the desktop app (needs the desktop build deps, see README)
    deps: [web:build]
    cmds:
      - go run -tags desktop,embedweb ./cmd/desktop

  web:dev:
    cmds:
      - pnpm --dir web dev --open

  # ---------------------------------------------------------------- build
  build:
    desc: Build the web UI and Go binaries (server embeds the UI) into ./bin
    deps: [web:build]
    cmds:
      - go build -tags embedweb -ldflags "{{.LDFLAGS}}" -o {{.BIN}}/server ./cmd/server
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BIN}}/starter ./cmd/starter

  build:desktop:
    desc: Build the desktop app, with the web UI built in, into ./bin (needs the desktop build deps, see README)
    deps: [web:build]
    cmds:
      - go build -tags desktop,embedweb -ldflags "-s -w" -o {{.BIN}}/starter-desktop ./cmd/desktop

  # ---------------------------------------------------------------- package
  # Each format has its own task, so one can be built alone (the package
  # check builds the .deb at other versions). nfpm.yaml reads VERSION and ARCH
  # from the environment.
  package:desktop:linux:
    desc: Package the desktop app for Linux (.deb, .rpm and AppImage) into ./bin (needs the desktop build deps, see README)
    cmds:
      - task: package:desktop:linux:deb
      - task: package:desktop:linux:rpm
      - task: package:desktop:linux:appimage

  package:desktop:linux:deb:
    deps: [build:desktop]
    env: { VERSION: "{{.PACKAGE_VERSION}}", ARCH: "{{.ARCH}}" }
    cmds:
      - "{{.WAILS}} tool package -format deb -config build/desktop/linux/nfpm.yaml -name starter-desktop_{{.PACKAGE_VERSION}}_{{.ARCH}} -out {{.BIN}}"

  package:desktop:linux:rpm:
    deps: [build:desktop]
    env: { VERSION: "{{.PACKAGE_VERSION}}", ARCH: "{{.ARCH}}" }
    cmds:
      # rpm calls amd64 x86_64. nfpm converts ARCH itself; the file name is ours.
      - "{{.WAILS}} tool package -format rpm -config build/desktop/linux/nfpm.yaml -name starter-desktop-{{.PACKAGE_VERSION}}-1.x86_64 -out {{.BIN}}"

  package:desktop:linux:appimage:
    deps: [build:desktop]
    cmds:
      # Wails names the icon and desktop file after their files, and the
      # AppImage after the program.
      - mkdir -p {{.BIN}}/appimage
      - cp web/public/pwa-512x512.png {{.BIN}}/appimage/com.example.starter.png
      - cp build/desktop/linux/app.desktop {{.BIN}}/appimage/com.example.starter.desktop
      - "{{.WAILS}} generate appimage -binary {{.BIN}}/starter-desktop -icon {{.BIN}}/appimage/com.example.starter.png -desktopfile {{.BIN}}/appimage/com.example.starter.desktop -builddir {{.BIN}}/appimage -outputdir {{.BIN}}/appimage"
      - mv {{.BIN}}/appimage/starter-desktop-x86_64.AppImage {{.BIN}}/starter-desktop-{{.PACKAGE_VERSION}}-x86_64.AppImage

  # ---------------------------------------------------------------- mobile
  # Built directly rather than with wails3's own Taskfile, because this repo
  # isn't laid out as a Wails project. See docs/mobile.md for the SDK setup.
  mobile:android:build:
    desc: Build the Android app (a debug APK for phones and the emulator) into ./bin (needs the Android SDK, NDK and a JDK, see docs/mobile.md)
    deps: [web:build]
    cmds:
      - task: mobile:android:lib
        vars: { GOARCH: arm64, CLANG: aarch64-linux-android21-clang, ABI: arm64-v8a }
      - task: mobile:android:lib
        vars: { GOARCH: amd64, CLANG: x86_64-linux-android21-clang, ABI: x86_64 }
      - cd mobile/android && ./gradlew assembleDebug --quiet
      - mkdir -p {{.BIN}}
      - cp mobile/android/app/build/outputs/apk/debug/app-debug.apk {{.BIN}}/starter.apk

  mobile:android:run:
    desc: Build the Android app, install it on the connected phone or emulator (starting the emulator if none is) and open it
    deps: [mobile:android:build]
    cmds:
      - |
        if ! "{{.ADB}}" get-state >/dev/null 2>&1; then
          AVD="${AVD:-$("{{.ANDROID_HOME}}/emulator/emulator" -list-avds | head -1)}"
          if [ -z "$AVD" ]; then echo "No phone or emulator connected, and no AVD to start (see docs/mobile.md)"; exit 1; fi
          echo "Starting the $AVD emulator"
          nohup "{{.ANDROID_HOME}}/emulator/emulator" -avd "$AVD" >/dev/null 2>&1 &
          "{{.ADB}}" wait-for-device
          until [ "$("{{.ADB}}" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 2; done
        fi
      # -r keeps the app's data, as an update from a store would.
      - '"{{.ADB}}" install -r {{.BIN}}/starter.apk'
      - '"{{.ADB}}" shell am start -n {{.ANDROID_APP_ID}}/com.wails.app.MainActivity'

  # The Go side of the app, as the shared library Android loads, for one ABI.
  mobile:android:lib:
    internal: true
    cmds:
      - |
        NDK="${ANDROID_NDK_HOME:-$(ls -d "{{.ANDROID_HOME}}"/ndk/* 2>/dev/null | sort -V | tail -1)}"
        if [ ! -d "$NDK" ]; then echo "Android NDK not found: install it (see docs/mobile.md) or set ANDROID_NDK_HOME"; exit 1; fi
        CGO_ENABLED=1 GOOS=android GOARCH={{.GOARCH}} \
          CC="$NDK/toolchains/llvm/prebuilt/$(uname -s | tr '[:upper:]' '[:lower:]')-x86_64/bin/{{.CLANG}}" \
          go build -buildmode=c-shared -tags embedweb -ldflags "-s -w" \
          -o mobile/android/app/src/main/jniLibs/{{.ABI}}/libwails.so ./cmd/mobile
      # go build also writes a C header the app doesn't use.
      - rm -f mobile/android/app/src/main/jniLibs/{{.ABI}}/libwails.h

  web:build:
    cmds:
      - pnpm --dir web build
    sources: [web/src/**/*, web/public/**/*, web/index.html, web/package.json, web/vite.config.ts]
    generates: [web/dist/index.html]

  # ---------------------------------------------------------------- quality
  lint:
    desc: Lint Go and TypeScript
    cmds:
      - golangci-lint run ./...
      - pnpm --dir web lint
      - pnpm --dir web typecheck
      - pnpm --dir web format:check

  fmt:
    desc: Format Go and TypeScript
    cmds:
      - golangci-lint fmt ./...
      - pnpm --dir web format

  # ---------------------------------------------------------------- tests
  test:
    desc: Unit tests (Go + web) — the TDD inner loop
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    cmds:
      - go test -race ./internal/... ./scripts/internal/... ./scripts/rename/ {{.CLI_ARGS}}
      # template:start
      - go test -race ./scripts/initproject/ {{.CLI_ARGS}}
      # template:end

  test:web:
    cmds:
      - pnpm --dir web test

  accept:
    desc: "Godog acceptance tests — the BDD outer loop (e.g. task accept -- --godog.tags=@wip)"
    cmds:
      - go test ./test/acceptance/ -count=1 {{.CLI_ARGS}}

  # template:start
  test:init:
    desc: "Acceptance tests for the template's init tool (slow: each scenario copies and rebuilds the repo)"
    cmds:
      - go test ./scripts/initproject/acceptance/ -count=1 -timeout 30m {{.CLI_ARGS}}
  # template:end

  test:package:
    desc: "Package check: build the desktop app's Linux packages and look inside (slow: it builds an AppImage)"
    cmds:
      - go test -tags packaging ./test/packaging/ -count=1 -timeout 30m {{.CLI_ARGS}}

  test:rename:
    desc: "Acceptance tests for the rename tool (slow: each scenario copies and rebuilds the repo)"
    cmds:
      - go test ./scripts/rename/acceptance/ -count=1 -timeout 30m {{.CLI_ARGS}}

  e2e:
    desc: Browser BDD tests (playwright-bdd) against the real server with the embedded UI
    deps: [web:build]
    cmds:
      - pnpm --dir web e2e {{.CLI_ARGS}}

  check:
    desc: Everything CI runs, in order
    cmds:
      - task: gen:check
      - task: lint
      - task: test
      - task: accept
      - task: e2e

  # ---------------------------------------------------------------- docker
  docker:build:
    desc: Build the production image
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} -t starter:{{.VERSION}} -t starter:latest .

  docker:up:
    desc: Run the app in Docker on http://localhost:8080 (data in a named volume)
    cmds:
      - docker compose up --build

  clean:
    cmds:
      - rm -rf {{.BIN}} web/dist web/.features-gen web/playwright-report web/test-results

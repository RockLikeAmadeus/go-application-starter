version: "2"

run:
  # Lint the package check too (test/packaging), which builds only with this
  # tag. It adds no code to anything else.
  build-tags: [packaging]

linters:
  enable:
    - depguard
    - errorlint
    - misspell
    - revive
    - unconvert
    - usestdlibvars
  settings:
    depguard:
      rules:
        # The hexagon's dependency rule: the core knows nothing about adapters,
        # the composition root, or concrete frameworks.
        core:
          files:
            - "**/internal/core/**"
            - "!$test"
          deny:
            - pkg: github.com/RockLikeAmadeus/go-application-starter/internal/adapters
              desc: core must not import adapters; depend on a port instead
            - pkg: github.com/RockLikeAmadeus/go-application-starter/internal/bootstrap
              desc: core must not import the composition root
            - pkg: github.com/RockLikeAmadeus/go-application-starter/internal/config
              desc: core must not read configuration
            - pkg: net/http
              desc: transport concerns belong in an adapter
            - pkg: database/sql
              desc: persistence belongs in a storage adapter
            - pkg: os
              desc: I/O belongs in an adapter
        # Domain is the innermost ring: it may not even see ports.
        domain:
          files:
            - "**/internal/core/domain/**"
            - "!$test"
          deny:
            - pkg: github.com/RockLikeAmadeus/go-application-starter/internal/core/ports
              desc: domain must not depend on ports
            - pkg: github.com/RockLikeAmadeus/go-application-starter/internal/core/app
              desc: domain must not depend on use cases
        # The fake sign-in provider is for tests only. The acceptance tests'
        # drivers and steps are test code that lives in non-test files.
        oidctest-tests-only:
          files:
            - $all
            - "!$test"
            - "!**/test/acceptance/**"
          deny:
            - pkg: github.com/RockLikeAmadeus/go-application-starter/internal/adapters/oidc/oidctest
              desc: the fake sign-in provider is only for tests
        # The core's tests are unit tests: no database, network, or files.
        # Strict mode refuses any import not allowed here, so they can use
        # the standard library, the core, memory storage, and the testsupport
        # fakes, and no other adapter, even one added later. A deny entry
        # overrides an allow entry, which keeps the parts of the standard
        # library that reach outside the process out.
        core-tests:
          list-mode: strict
          files:
            - "**/internal/core/**/*_test.go"
          allow:
            - $gostd
            - github.com/RockLikeAmadeus/go-application-starter/internal/core
            - github.com/RockLikeAmadeus/go-application-starter/internal/adapters/storage/memory
            - github.com/RockLikeAmadeus/go-application-starter/internal/testsupport
          deny:
            - pkg: database/sql
              desc: core tests use no database; use memory storage
            - pkg: net
              desc: core tests use no network
            - pkg: os
              desc: core tests use no files or environment; use the testsupport fakes
    staticcheck:
      # golangci-lint's default checks, plus -ST1005: error strings users read
      # are whole sentences, capitalised and ending in a full stop
      # (.claude/rules/user-facing-text.md).
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: strict
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/RockLikeAmadeus/go-application-starter

openapi: 3.0.3
info:
  title: Starter API
  version: 0.1.0
  description: |
    HTTP contract for the web UI and remote CLI/TUI clients.
    This file is the single source of truth: Go server/client code and the
    TypeScript client types are generated from it (`task gen`).
paths:
  /api/v1/connection:
    get:
      operationId: getConnection
      tags: [connection]
      responses:
        "200":
          description: Whether the app needs a network connection to reach its data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/entitlements:
    get:
      operationId: getEntitlements
      tags: [entitlements]
      responses:
        "200":
          description: The current workspace's plan and what it allows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entitlements"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/warnings:
    get:
      operationId: getWarnings
      tags: [warnings]
      responses:
        "200":
          description: What the user should know about how the app keeps their data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Warnings"
        default:
          $ref: "#/components/responses/Problem"
  # sample:start
  /api/v1/items:
    get:
      operationId: listItems
      tags: [items]
      responses:
        "200":
          description: All items, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createItem
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/items/export:
    get:
      operationId: exportItems
      tags: [items]
      responses:
        "200":
          description: All items as CSV, oldest first.
          content:
            text/csv:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getItem
      tags: [items]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: renameItem
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "200":
          description: The renamed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteItem
      tags: [items]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
  # sample:end
components:
  responses:
    Problem:
      description: An error, as an RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Connection:
      type: object
      required: [isRequired]
      properties:
        isRequired:
          type: boolean
          description: |
            True when the app reaches its data over the network (the server).
            False when the data is on this device (the desktop app's local-only
            mode), so a lost connection doesn't matter.
    Entitlements:
      type: object
      required: [plan, limits, features]
      properties:
        plan:
          type: string
          description: The name of the plan the workspace is on.
        limits:
          type: object
          description: The plan's limits, by name (e.g. "items"). A limit that isn't here doesn't apply.
          additionalProperties:
            $ref: "#/components/schemas/Limit"
        features:
          type: object
          description: |
            Every feature the plans know, by key (e.g. "item-export"), whether
            the plan has it or not. A feature that isn't here is off.
          additionalProperties:
            $ref: "#/components/schemas/Feature"
    Feature:
      type: object
      required: [name, isOn, whenOff, availableOn]
      properties:
        name:
          type: string
          description: What people read (e.g. "Item export").
        isOn:
          type: boolean
          description: True when the workspace's plan has the feature.
        whenOff:
          $ref: "#/components/schemas/FeatureOffBehavior"
        availableOn:
          type: array
          description: |
            The plans that have the feature, for the upgrade hint. Empty when
            the edition gives no hints.
          items:
            type: string
    Limit:
      type: object
      required: [max, whenOver]
      properties:
        max:
          type: integer
          minimum: 0
          description: How many the plan allows.
        whenOver:
          $ref: "#/components/schemas/OverLimitBehavior"
    OverLimitBehavior:
      type: string
      enum: [block-new, read-only]
      description: |
        What happens at or over a limit. block-new: no new ones can be
        added. read-only: no new ones either, and over the limit the
        existing ones can't be changed, only deleted.
    FeatureOffBehavior:
      type: string
      enum: [show-locked, hide]
      description: |
        What to show of a feature that's off. show-locked: show it locked,
        with the upgrade hint. hide: leave it out.
    Warnings:
      type: object
      required: [warnings]
      properties:
        warnings:
          type: array
          description: The warnings to show, in order. Empty when there are none.
          items:
            $ref: "#/components/schemas/Warning"
    Warning:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: |
            The warning, ready to show as given (e.g. that the data folder
            looks synced by a sync service).
    # sample:start
    Item:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
    ItemInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
    # sample:end
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          description: Machine-readable error code, e.g. "not_found", "validation".
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        field:
          type: string
          description: The offending input field, for validation errors.
        limit:
          type: string
          description: The plan limit that was reached (e.g. "items"), for limit errors.
        max:
          type: integer
          description: The plan's maximum for that limit, for limit errors.
        plan:
          type: string
          description: The plan that sets the limit (e.g. "free"), for limit errors.
        isReadOnly:
          type: boolean
          description: |
            For limit errors: true when the change was refused because the
            workspace is over a limit that makes things read only, false when
            a new one was refused at the limit.
        feature:
          type: string
          description: The feature's key (e.g. "item-export"), for feature errors.
        name:
          type: string
          description: The feature's display name (e.g. "Item export"), for feature errors.
        availableOn:
          type: array
          items:
            type: string
          description: |
            For feature errors: the plans that have the feature, for the
            upgrade hint. Empty when there's no hint to give.

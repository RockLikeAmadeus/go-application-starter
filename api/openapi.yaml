openapi: 3.0.3
info:
  title: Starter API
  version: 0.1.0
  description: |
    HTTP contract for the web UI and remote CLI/TUI clients.
    This file is the single source of truth: Go server/client code and the
    TypeScript client types are generated from it (`task gen`).
paths:
  /api/v1/items:
    get:
      operationId: listItems
      tags: [items]
      responses:
        "200":
          description: All items, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createItem
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getItem
      tags: [items]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: renameItem
      tags: [items]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "200":
          description: The renamed item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteItem
      tags: [items]
      responses:
        "204":
          description: Deleted.
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: An error, as an RFC 9457 problem document.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Item:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
    ItemInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Problem:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          description: Machine-readable error code, e.g. "not_found", "validation".
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        field:
          type: string
          description: The offending input field, for validation errors.

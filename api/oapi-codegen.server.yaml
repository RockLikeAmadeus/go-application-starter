# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: openapi
output: internal/adapters/httpapi/openapi/server.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
output-options:
  # problem.go renders every error as a Problem, even when no path uses it.
  skip-prune: true
